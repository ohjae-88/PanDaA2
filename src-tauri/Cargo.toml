[package]
name = "aion2-companion"
version = "5.5.7"
description = "판다의 A2 통합 — AION2 컴패니언"
authors = ["PandaA2"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aion2_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
# Updater — endpoint(public URL) + pubkey 설정 후 활성화. tauri.conf.json의 plugins.updater 추가 필요.
# 현재는 dep만 추가 — 빌더 init은 endpoint 설정 후 활성화.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"

# ── 화면 캡처 + OCR (보스 잔여시간 동기화) ──
# xcap: 화면 캡처(주 모니터). image: 크롭/PNG 인코딩. base64: 미리보기 전송.
# paddle-ocr-rs: PaddleOCR ONNX(det+cls+rec) 한국어 인식 (ort/ONNX Runtime).
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
paddle-ocr-rs = "0.6"
# paddle-ocr-rs 0.6.1은 ort rc.10 API 기준 — rc.12로 올라가면 빌드 깨짐. 정확히 핀.
ort = "=2.0.0-rc.10"

[features]
# 향후 인게임 오버레이 기능 활성화 시 사용
overlay = []
