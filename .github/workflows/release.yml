# Tauri Release + Updater 워크플로우
#
# 트리거: v*.*.* 태그 푸시 (예: v5.4.1)
#
# 동작:
#  1. Windows 러너에서 `tauri build` → NSIS .exe + .exe.sig 생성
#  2. GitHub Release 생성 (draft)
#  3. .exe / .exe.sig / latest.json 첨부
#  4. release publish 시 사용자 앱에서 updater 감지 → 자동 알림
#
# 활성화 전 필수:
#  - Repo Settings → Secrets 추가:
#      TAURI_SIGNING_PRIVATE_KEY        (npx @tauri-apps/cli signer generate 결과의 .key 내용)
#      TAURI_SIGNING_PRIVATE_KEY_PASSWORD (키 생성 시 입력한 암호)
#  - tauri.conf.json plugins.updater.pubkey 에 공개키(base64) 입력
#  - tauri.conf.json plugins.updater.active = true
#  - tauri.conf.json plugins.updater.endpoints 의 USER/REPO 실제 값으로 교체

name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Find artifacts
        id: artifacts
        shell: bash
        run: |
          set -e
          nsis_dir="src-tauri/target/release/bundle/nsis"
          exe=$(ls "$nsis_dir"/*.exe | head -1)
          sig="${exe}.sig"
          echo "exe_path=$exe" >> $GITHUB_OUTPUT
          echo "sig_path=$sig" >> $GITHUB_OUTPUT
          echo "exe_name=$(basename "$exe")" >> $GITHUB_OUTPUT

      - name: Generate latest.json
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          exe_name="${{ steps.artifacts.outputs.exe_name }}"
          sig=$(cat "${{ steps.artifacts.outputs.sig_path }}")
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${exe_name}"
          cat > latest.json <<EOF
          {
            "version": "${version}",
            "notes": "릴리즈 노트는 GitHub Release 본문 참조.",
            "pub_date": "${pub_date}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${sig}",
                "url": "${download_url}"
              }
            }
          }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: |
            ${{ steps.artifacts.outputs.exe_path }}
            ${{ steps.artifacts.outputs.sig_path }}
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
