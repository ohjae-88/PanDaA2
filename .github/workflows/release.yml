# Tauri Release + Updater 워크플로우
#
# 트리거: v*.*.* 태그 푸시 (예: v5.4.1)
#
# 동작:
#  1. Windows 러너에서 `tauri build` → NSIS .exe 생성
#  2. 한글 파일명 → ASCII 파일명(PandaA2_{version}_x64-setup.exe)으로 복사
#     (한글 URL 인코딩이 GitHub CDN에서 404를 유발하는 문제 방지)
#  3. 서명 secrets 있으면 .exe.sig + latest.json 생성
#  4. GitHub Release 생성 (draft)
#
# Updater 활성화 (선택):
#  1. 로컬에서: npx @tauri-apps/cli signer generate -w ~/.tauri/aion2.key
#  2. Repo Secrets에 등록:
#       TAURI_SIGNING_PRIVATE_KEY        (~/.tauri/aion2.key 파일 내용)
#       TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (키 생성 시 설정한 비밀번호, 없으면 빈 문자열)
#  3. tauri.conf.json plugins.updater 확인 (pubkey 설정)
#  4. capabilities/default.json에 "updater:default" 확인

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Check signing secret presence
        id: secrets_check
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
            echo "::notice::Signing secrets detected — updater signature will be generated"
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY missing — building without updater signature"
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Tauri
        run: npm run tauri build

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Rename installer to ASCII filename
        id: rename
        shell: bash
        run: |
          set -e
          nsis_dir="src-tauri/target/release/bundle/nsis"
          if [ ! -d "$nsis_dir" ]; then
            echo "::error::NSIS bundle directory not found: $nsis_dir"
            ls -R src-tauri/target/release/bundle/ || true
            exit 1
          fi
          # 한글 파일명 exe 찾기
          original=$(ls "$nsis_dir"/*.exe 2>/dev/null | head -1 || true)
          if [ -z "$original" ]; then
            echo "::error::No .exe found in $nsis_dir"
            ls -la "$nsis_dir"
            exit 1
          fi
          version="${{ steps.version.outputs.version }}"
          # ASCII 파일명으로 복사 — 한글 URL 인코딩 문제 방지
          ascii_name="PandaA2_${version}_x64-setup.exe"
          ascii_path="$nsis_dir/$ascii_name"
          cp "$original" "$ascii_path"
          echo "original=$original" >> $GITHUB_OUTPUT
          echo "exe_path=$ascii_path" >> $GITHUB_OUTPUT
          echo "exe_name=$ascii_name" >> $GITHUB_OUTPUT
          echo "Renamed: $(basename "$original") → $ascii_name"

      - name: Sign bundle
        if: steps.secrets_check.outputs.has_signing == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          exe="${{ steps.rename.outputs.exe_path }}"
          echo "Signing: $exe"
          npx @tauri-apps/cli signer sign "$exe"
          echo "Signature created: ${exe}.sig"
          ls -la "${exe}.sig"

      - name: Check sig file
        id: sig_check
        shell: bash
        run: |
          sig="${{ steps.rename.outputs.exe_path }}.sig"
          if [ -f "$sig" ]; then
            echo "sig_path=$sig" >> $GITHUB_OUTPUT
            echo "has_sig=true" >> $GITHUB_OUTPUT
          else
            echo "has_sig=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate latest.json
        if: steps.sig_check.outputs.has_sig == 'true'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          exe_name="${{ steps.rename.outputs.exe_name }}"
          sig=$(cat "${{ steps.sig_check.outputs.sig_path }}")
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # ASCII 파일명 사용 — URL 인코딩 불필요
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${exe_name}"
          cat > latest.json <<EOF
          {
            "version": "${version}",
            "notes": "릴리즈 노트는 GitHub Release 본문 참조.",
            "pub_date": "${pub_date}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${sig}",
                "url": "${download_url}"
              }
            }
          }
          EOF
          echo "Generated latest.json:"
          cat latest.json

      - name: Collect release files
        id: files
        shell: bash
        run: |
          files="${{ steps.rename.outputs.exe_path }}"
          if [ "${{ steps.sig_check.outputs.has_sig }}" = "true" ]; then
            files="${files}"$'\n'"${{ steps.sig_check.outputs.sig_path }}"$'\n'"latest.json"
          fi
          {
            echo 'list<<EOF'
            echo "$files"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: "v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: ${{ steps.files.outputs.list }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
