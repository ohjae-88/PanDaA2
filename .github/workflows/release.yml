# Tauri Release + Updater 워크플로우
#
# 트리거: v*.*.* 태그 푸시 (예: v5.4.1)
#
# 동작:
#  1. Windows 러너에서 `tauri build` → NSIS .exe 생성
#  2. GitHub Release 생성 (draft)
#  3. .exe 첨부 (서명 secrets 있으면 .exe.sig + latest.json도 첨부)
#
# Updater 활성화 (선택):
#  1. 로컬에서: npx @tauri-apps/cli signer generate -w ~/.tauri/aion2.key
#  2. Repo Secrets에 등록:
#       TAURI_SIGNING_PRIVATE_KEY        (~/.tauri/aion2.key 파일 내용)
#       TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#  3. tauri.conf.json plugins.updater 활성화 (현재 제거됨 → 활성 시 복원)
#  4. capabilities/default.json에 "updater:default" 추가

name: Release

on:
  push:
    tags:
      - "v*.*.*"

# GitHub Release 생성 + 파일 업로드 위해 contents:write 권한 필요.
# Settings → Actions → General → Workflow permissions = "Read repository contents and packages permissions"
# 이면 명시 안 해도 되지만, 명시가 더 안전.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Check signing secret presence
        id: secrets_check
        shell: bash
        run: |
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "has_signing=true" >> $GITHUB_OUTPUT
            echo "::notice::Signing secrets detected — updater signature will be generated"
          else
            echo "has_signing=false" >> $GITHUB_OUTPUT
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY missing — building without updater signature"
          fi

      - name: Install dependencies
        # npm install 사용 — lockfile drift 허용 (npm ci는 정확 일치 요구).
        # CI 재현성보다 빌드 성공 우선. lockfile은 부수적으로 갱신될 수 있음.
        run: npm install --no-audit --no-fund

      - name: Build Tauri
        run: npm run tauri build

      - name: Sign bundle (explicit)
        if: steps.secrets_check.outputs.has_signing == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -e
          nsis_dir="src-tauri/target/release/bundle/nsis"
          exe=$(ls "$nsis_dir"/*.exe 2>/dev/null | head -1 || true)
          if [ -z "$exe" ]; then
            echo "::error::No .exe found to sign"
            exit 1
          fi
          echo "Signing: $exe"
          # TAURI_SIGNING_PRIVATE_KEY 는 env에서 CLI가 자동 읽음 (-k 인수 불필요)
          npx @tauri-apps/cli signer sign "$exe"
          echo "Signature created: ${exe}.sig"
          ls -la "${exe}.sig"

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Find artifacts
        id: artifacts
        shell: bash
        run: |
          set -e
          nsis_dir="src-tauri/target/release/bundle/nsis"
          if [ ! -d "$nsis_dir" ]; then
            echo "::error::NSIS bundle directory not found: $nsis_dir"
            ls -R src-tauri/target/release/bundle/ || true
            exit 1
          fi
          exe=$(ls "$nsis_dir"/*.exe 2>/dev/null | head -1 || true)
          if [ -z "$exe" ]; then
            echo "::error::No .exe found in $nsis_dir"
            ls -la "$nsis_dir"
            exit 1
          fi
          echo "exe_path=$exe" >> $GITHUB_OUTPUT
          echo "exe_name=$(basename "$exe")" >> $GITHUB_OUTPUT
          # Optional .sig file (signing 시에만 생성)
          sig="${exe}.sig"
          if [ -f "$sig" ]; then
            echo "sig_path=$sig" >> $GITHUB_OUTPUT
            echo "has_sig=true" >> $GITHUB_OUTPUT
          else
            echo "has_sig=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate latest.json
        if: steps.artifacts.outputs.has_sig == 'true'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          exe_name="${{ steps.artifacts.outputs.exe_name }}"
          sig=$(cat "${{ steps.artifacts.outputs.sig_path }}")
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${exe_name}"
          cat > latest.json <<EOF
          {
            "version": "${version}",
            "notes": "릴리즈 노트는 GitHub Release 본문 참조.",
            "pub_date": "${pub_date}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${sig}",
                "url": "${download_url}"
              }
            }
          }
          EOF

      - name: Collect release files
        id: files
        shell: bash
        run: |
          files="${{ steps.artifacts.outputs.exe_path }}"
          if [ "${{ steps.artifacts.outputs.has_sig }}" = "true" ]; then
            files="${files}"$'\n'"${{ steps.artifacts.outputs.sig_path }}"$'\n'"latest.json"
          fi
          {
            echo 'list<<EOF'
            echo "$files"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: ${{ steps.files.outputs.list }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
